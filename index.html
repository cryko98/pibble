
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pibble | $PIBBLE 🎀</title>
    <link rel="icon" type="image/jpeg" href="https://pbs.twimg.com/media/G7vOAi4XoAAjnBL?format=jpg&name=small">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Bungee&family=Grandstander:wght@100..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pibble-pink: #FF69B4;
            --pibble-soft-pink: #FFB6C1;
            --pibble-white: #FFFFFF;
        }
        body {
            font-family: 'Fredoka', sans-serif;
            overflow-x: hidden;
            background-color: #fff5f8;
            background-image: url("https://www.transparenttextures.com/patterns/paws.png");
        }
        .font-bungee { font-family: 'Bungee', cursive; }
        .font-cute { font-family: 'Grandstander', cursive; }
        
        .text-outline {
            -webkit-text-stroke: 2px black;
        }

        /* 3D Card Flip Styles */
        .perspective-1000 {
            perspective: 1000px;
        }
        .preserve-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) translateX(150px) rotate(720deg);
                opacity: 0;
            }
        }

        .petal {
            position: fixed;
            background-color: #ffb7c5;
            border-radius: 150% 0 150% 0;
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(255, 182, 193, 0.4);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #fff5f8;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #FF69B4;
            border-radius: 10px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "framer-motion": "https://esm.sh/framer-motion@11.11.11?deps=react@18.3.1,react-dom@18.3.1",
    "lucide-react": "https://esm.sh/lucide-react@0.454.0?deps=react@18.3.1,react-dom@18.3.1"
  }
}
</script>
</head>
<body class="custom-scrollbar">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
